#
# The superbuild of every repo's main, nightly, on Arch. It catches API breaks
# between repos before a release. The packaging nightly checks the installed
# side (Config files, install rules), which an in-tree build cannot see.
#
# A change that spans repos is a change set: one branch name in each repo it
# touches (tools/change). Every repo that has the branch is checked out on it,
# and every other repo stays on main. A pull request here builds the change set
# of its own branch. Run by hand with `change_set` set to a branch name to build
# a set that has no branch here (tools/change build).
#
# Each repo lists its own Arch packages in .github/ci/arch-packages.txt, and
# this job installs the union of them, so no list is kept here.

name: Superbuild

on:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    # Plugins, conventions and docs do not change what the superbuild builds.
    paths-ignore: [".claude/**", ".claude-plugin/**", "plugins/**", "claude/**", "tools/setup", "tools/change", "tools/new-repo", "templates/**", "**.md", ".github/workflows/cpp-ci.yml", ".github/workflows/flake-update.yml"]
  workflow_dispatch:
    inputs:
      change_set:
        description: "Branch to build in every repo that has it (empty: main everywhere)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: superbuild-${{ github.ref }}-${{ inputs.change_set }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
        working-directory: workspace
    steps:
      - name: Bootstrap git and Python
        working-directory: /
        run: pacman -Syu --noconfirm --needed git python

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: workspace
          fetch-depth: 2

      # The manifest names SSH URLs for developers. CI clones over HTTPS.
      # vcstool imports pkg_resources, which setuptools 81 removed.
      - name: Clone every repo
        run: |
          set -euo pipefail
          python -m venv /opt/vcstool
          /opt/vcstool/bin/pip install --quiet --no-cache-dir vcstool 'setuptools<81'
          # Not on PATH: CMake would find the virtualenv's python, which has
          # none of the system Python modules the tests use (python-dbus).
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          /opt/vcstool/bin/vcs import --skip-existing --input workspace.repos ..

      - name: Check out the change set
        id: set
        if: inputs.change_set != '' || github.event_name == 'pull_request'
        env:
          CHANGE_SET: ${{ inputs.change_set || github.head_ref }}
        run: |
          set -euo pipefail
          for dir in ../*/; do
            repo=$(basename "$dir")
            # This checkout is already the commit the run is for.
            [ "$repo" = workspace ] && continue
            [ -d "$dir/.git" ] || continue
            if git -C "$dir" ls-remote --exit-code --heads origin "$CHANGE_SET" >/dev/null; then
              git -C "$dir" fetch --quiet origin "$CHANGE_SET"
              # A branch that main already holds is a part of the set that
              # merged and whose branch was kept: main is newer than it.
              if git -C "$dir" merge-base --is-ancestor FETCH_HEAD HEAD; then
                echo "$repo: $CHANGE_SET is merged, main"
                continue
              fi
              git -C "$dir" checkout --quiet -B "$CHANGE_SET" FETCH_HEAD
              echo "$repo: $CHANGE_SET"
              echo "other=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # A pull request that changes only the shared-file tooling (tools/sync
      # and sync/), with no branch of its change set in another repo, builds
      # nothing: the check below is all that it can change. A pull request is
      # checked out as its merge commit, whose first parent is the base.
      - name: Build or not
        id: build
        env:
          EVENT: ${{ github.event_name }}
          OTHER: ${{ steps.set.outputs.other }}
        run: |
          set -euo pipefail
          build=true
          if [ "$EVENT" = pull_request ] && [ "$OTHER" != true ]; then
            build=false
            while IFS= read -r file; do
              case "$file" in
                tools/sync|sync/*) ;;
                *) build=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build: $build"

      # Every repository holds the same shared files (.clang-format,
      # .editorconfig, CMakePresets.json, the lefthook remote).
      - name: Check the shared files
        run: python3 -I tools/sync --check

      - name: Record the commits
        run: tools/snapshot > ../snapshot.repos && cat ../snapshot.repos

      - name: Install packages
        if: steps.build.outputs.build == 'true'
        run: |
          set -euo pipefail
          mapfile -t packages < <(cat ../*/.github/ci/arch-packages.txt \
            | sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' | sort -u)
          for try in 1 2 3; do
            pacman -S --noconfirm --needed "${packages[@]}" && exit 0
            [ "$try" = 3 ] && exit 1
            sleep 10
          done

      - name: Restore the dependency archives
        if: steps.build.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: workspace/.cache/cpm
          key: cpm-${{ hashFiles('*/cmake/*Dependencies.cmake') }}
          restore-keys: cpm-

      - name: Set up the compiler cache
        if: steps.build.outputs.build == 'true'
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_MAXSIZE=5G"
          } >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        if: steps.build.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-superbuild-relwithdebinfo-${{ github.run_id }}
          restore-keys: ccache-superbuild-relwithdebinfo-

      # Optimized with debug info, as each app's own CI and the packages build.
      # The scripting tests hold handlers to CPU-time limits, and at -O0 on a
      # shared runner they pass them (Afterglow's 20 ms on_* limit).
      - name: Configure
        if: steps.build.outputs.build == 'true'
        run: cmake --preset relwithdebinfo

      # The presets cap jobs at 3 for 16 GB machines. The runner has 4 cores.
      - name: Build
        if: steps.build.outputs.build == 'true'
        run: cmake --build --preset relwithdebinfo -j "$(nproc)"

      - name: Test
        if: steps.build.outputs.build == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset relwithdebinfo -j "$(nproc)"

      - name: Compiler cache statistics
        if: (always()) && steps.build.outputs.build == 'true'
        run: ccache --show-stats || true

      # `vcs import --input snapshot.repos` reproduces the failing tree.
      - name: Upload the snapshot
        if: (failure()) && steps.build.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: snapshot.repos
