name: Bug
description: "Something does not work as it should."
labels: [bug]
body:
  - type: dropdown
    id: repositories
    attributes:
      label: Repositories
      description: "Each repository that the work changes. The issue gets a `repo:` label for each one."
      multiple: true
      options:
        - PlasmaZones
        - Lambent
        - Afterglow
        - Facet
        - Phosphor
        - phosphor-libs
        - phosphor-engine-libs
        - phosphor-shell-libs
        - phosphor-components
        - packaging
        - workspace
        - design-language
        - branding
    validations:
      required: true
  - type: dropdown
    id: areas
    attributes:
      label: Areas
      description: "The themes across repositories that the work belongs to, if any. Each gets an `area:` label."
      multiple: true
      options:
        - ci
        - packaging
        - testing
        - performance
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: "What you did, what happened, and what you expected."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: "The steps, the versions and the environment (distribution, compositor)."
    validations:
      required: true
