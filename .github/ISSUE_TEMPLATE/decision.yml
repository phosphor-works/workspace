name: Decision
description: "A choice that must be made before the work can start."
labels: [decision]
body:
  - type: dropdown
    id: repositories
    attributes:
      label: Repositories
      description: "Each repository that the work changes. The issue gets a `repo:` label for each one."
      multiple: true
      options:
        - PlasmaZones
        - Lambent
        - Afterglow
        - Facet
        - Phosphor
        - phosphor-libs
        - phosphor-engine-libs
        - phosphor-shell-libs
        - phosphor-components
        - packaging
        - workspace
        - design-language
        - branding
    validations:
      required: true
  - type: dropdown
    id: areas
    attributes:
      label: Areas
      description: "The themes across repositories that the work belongs to, if any. Each gets an `area:` label."
      multiple: true
      options:
        - ci
        - packaging
        - testing
        - performance
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: The question
      description: "What must be decided."
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: The options
      description: "Each option, with what it costs and what it gains."
    validations:
      required: true
